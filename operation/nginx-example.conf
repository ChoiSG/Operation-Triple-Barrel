user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log warn;

include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 1024;
}

http {
    map_hash_bucket_size 1024;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    map $http_user_agent $agent_ua_allowed {
        default 0;
        "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/1xx.0.0.0 Safari/537.36" 1;
    }

    log_format main '$remote_addr - $host [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_user_agent"';

    access_log /var/log/nginx/access.log main;
    server_tokens off;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 30m;
    gzip off;

    server {
        listen 80;
        listen [::]:80;
        server_name your-domain.example.com;

        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name your-domain.example.com;

        ssl_certificate /etc/letsencrypt/live/your-domain.example.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/your-domain.example.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:TLS:10m;
        ssl_session_timeout 10m;

        location / {
            if ($agent_ua_allowed = 0) {
                return 302 https://www.google.com/;
            }

            proxy_pass https://127.0.0.1:8443;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Client-Data $http_x_client_data;
            proxy_set_header User-Agent $http_user_agent;

            proxy_ssl_verify off;
            proxy_ssl_server_name off;
            proxy_ssl_session_reuse off;

            proxy_pass_header Server;
        }
    }
}
